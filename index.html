<main class="card" id="lock">
<h1>درجات الكويز والكشكول</h1>
<p class="hint">أدخل كلمة المرور التي استلمتها لعرض النتائج.</p>
<form id="unlock">
<label for="pw">كلمة المرور</label>
<input id="pw" type="password" autocomplete="current-password" required autofocus>
<button id="submit" type="submit">عرض النتائج</button>
<p class="error" id="error" role="alert"></p>
</form>
<p class="privacy">تُفك حماية الملف على جهازك داخل المتصفح. كلمة المرور مشتركة، وكل من يعرفها يستطيع مشاهدة جميع النتائج.</p>
</main>

const ITERATIONS=600000;
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById('unlock').addEventListener('submit',async e=>{
 e.preventDefault();
 const button=document.getElementById('submit'),error=document.getElementById('error');
 button.disabled=true;button.textContent='جارٍ التحقق…';error.textContent='';
 try{
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(SALT),iterations:ITERATIONS,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV),tagLength:128},key,bytes(DATA));
  const content=new TextDecoder().decode(plain);
  const frame=document.createElement('iframe');frame.title='درجات الطلاب';frame.setAttribute('sandbox','allow-scripts');frame.srcdoc=content;
  document.getElementById('results').appendChild(frame);document.getElementById('results').hidden=false;document.getElementById('lock').hidden=true;
 }catch(_){error.textContent='كلمة المرور غير صحيحة أو تعذر فتح الصفحة.';button.disabled=false;button.textContent='عرض النتائج';}
